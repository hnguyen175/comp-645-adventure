<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
  <script src="cordova.js"></script>
  <script src="components/loader.js"></script>
  <script src="lib/onsenui/js/onsenui.min.js"></script>
  <script src="js/show-ip-button.js" defer></script>
  <script type="module" src="js/App.js"></script>

  <link rel="stylesheet" href="components/loader.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsenui.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsen-css-components.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    ons.ready(function() {
      console.log("Onsen UI is ready!");
    });

    if (ons.platform.isIPhoneX()) {
      document.documentElement.setAttribute('onsflag-iphonex-portrait', '');
      document.documentElement.setAttribute('onsflag-iphonex-landscape', '');
    }
  </script>
</head>
<body>
  <br />

  <p></p>
  <ons-carousel id="carouselNewGame" swipeable auto-scroll>
    <ons-carousel-item id="caiWelcome">
      <ons-card>
        <header><h1>Welcome</h1></header>
        <ons-button class="btn js-load-game" id="btnBack" disabled >Reload</ons-button>
        <ons-button class="btn js-load-game" id="btnNewGame">New Game</ons-button>
      </ons-card>
    </ons-carousel-item>
    <ons-carousel-item id="caiNewGame">
      <ons-card>
        <header><h1>New Game</h1></header>

        <table>
          <tr>
            <td><ons-label for="inputPlayerName">Player Name:</ons-label></td>
            <td>
              <div class="input-with-clear"><ons-input input-id="inputPlayerName" placeholder="Enter Player Name"></ons-input>
                <ons-button id="btnClearName" class="btn" modifier="quiet">x</ons-button></td>
              </div>
          </tr>
          <tr>
            <td><ons-label for="inputPlayerEmail">Email:</ons-label></td>
            <td>
              <div class="input-with-clear"><ons-input input-id="inputPlayerEmail" placeholder="Enter Player Email"></ons-input>
                <ons-button id="btnClearEmail" class="btn" modifier="quiet">x</ons-button></td>
              </div>
          </tr>
        </table>

      </ons-card>
    </ons-carousel-item>

    <ons-carousel-item id="caiPlayers">
    </ons-carousel-item>

    </ons-carousel>

</body>
</html>
