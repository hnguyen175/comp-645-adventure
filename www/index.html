<!DOCTYPE HTML>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
    content="default-src * data: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
  <script src="cordova.js"></script>
  <script src="components/loader.js"></script>
  <script src="lib/onsenui/js/onsenui.min.js"></script>
  <script src="js/show-ip-button.js" defer></script>
  <script type="module" src="js/App.js"></script>

  <link rel="stylesheet" href="components/loader.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsenui.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsen-css-components.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    ons.ready(function () {
      console.log("Onsen UI is ready!");
    });

    if (ons.platform.isIPhoneX()) {
      document.documentElement.setAttribute('onsflag-iphonex-portrait', '');
      document.documentElement.setAttribute('onsflag-iphonex-landscape', '');
    }
  </script>
</head>

<body>
  <br />

  <p></p>
  <ons-carousel id="carouselNewGame" swipeable auto-scroll fullscreen>

    <ons-carousel-item id="caiWelcome">
      <header>
        <h1>Welcome to Adventure</h1>
      </header>
      <ons-card>
        <ons-button class="btn js-load-game" id="btnBack" disabled>Reload</ons-button>
        <ons-button class="btn js-load-game" id="btnNewGame">New Game</ons-button>
      </ons-card>
      <h4>Welcome to the Adventure game!</h4>
      <footer>Please select Load, New Game or swipe right to start a new game.</footer>
    </ons-carousel-item>

    <ons-carousel-item id="caiNewGame">
      <header>
        <h1>New Game</h1>
      </header>
      <ons-card>

        <h4>Enter your info to start a new game.</h4>
        <table class="player-input-table">
          <tr>
            <td>
              <div class="input-with-clear">
                <ons-input input-id="inputPlayerName" placeholder="Name" modifier="underbar"></ons-input>
                <ons-button id="btnClearName" class="btn" modifier="quiet">x</ons-button>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <div class="input-with-clear"><ons-input input-id="inputPlayerEmail" placeholder="Email"
                  modifier="underbar"></ons-input>
                <ons-button id="btnClearEmail" class="btn" modifier="quiet">x</ons-button>
              </div>
            </td>
          </tr>
        </table>

      </ons-card>
      <footer>Please swipe right to start gather your players.</footer>
    </ons-carousel-item>

    <ons-carousel-item id="caiPlayers">
      <header>
        <h1>Players are ready!</h1>
      </header>
      <div id="playerCards"></div>
      <footer>Are you ready? Swipe right to continue.</footer>
    </ons-carousel-item>

  </ons-carousel>

</body>

</html>
